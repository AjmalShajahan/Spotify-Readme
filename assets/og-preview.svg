<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="background" x1="120" y1="0" x2="1080" y2="630" gradientUnits="userSpaceOnUse">
      <stop stop-color="#11111b" />
      <stop offset="1" stop-color="#181825" />
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(110 40) rotate(35) scale(620 500)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#a6e3a1" stop-opacity=".24" />
      <stop offset="1" stop-color="#a6e3a1" stop-opacity="0" />
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#000" flood-opacity=".32" />
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#background)" />
  <rect width="1200" height="630" fill="url(#glow)" />

  <g transform="translate(80 82)">
    <circle cx="14" cy="14" r="8" fill="#a6e3a1" />
    <text x="38" y="22" fill="#a6e3a1" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="700" letter-spacing="3">SPOTIFY README</text>

    <text x="0" y="112" fill="#cdd6f4" font-family="DejaVu Sans, sans-serif" font-size="64" font-weight="700">Your music,</text>
    <text x="0" y="182" fill="#cdd6f4" font-family="DejaVu Sans, sans-serif" font-size="64" font-weight="700">in your</text>
    <text x="0" y="252" fill="#cdd6f4" font-family="DejaVu Sans, sans-serif" font-size="64" font-weight="700">README.</text>
    <text x="2" y="314" fill="#a6adc8" font-family="DejaVu Sans, sans-serif" font-size="24">Build a live, customizable Spotify card</text>
    <text x="2" y="349" fill="#a6adc8" font-family="DejaVu Sans, sans-serif" font-size="24">for your GitHub profile.</text>
  </g>

  <g transform="translate(650 112)" filter="url(#shadow)">
    <rect width="470" height="405" rx="30" fill="#1e1e2e" stroke="#313244" stroke-width="2" />
    <text x="36" y="55" fill="#9399b2" font-family="DejaVu Sans Mono, monospace" font-size="15" letter-spacing="2">LIVE OUTPUT</text>
    <circle cx="395" cy="49" r="6" fill="#a6e3a1" />
    <text x="413" y="55" fill="#a6e3a1" font-family="DejaVu Sans Mono, monospace" font-size="14">LIVE</text>

    <g transform="translate(36 86)">
      <rect width="398" height="128" rx="14" fill="#24273a" />
      <rect x="18" y="18" width="92" height="92" rx="10" fill="#313244" />
      <circle cx="64" cy="64" r="30" fill="#a6e3a1" />
      <path d="M47 55c12-4 27-3 38 3M49 65c10-3 23-2 32 3M52 75c7-2 17-1 24 2" fill="none" stroke="#1e1e2e" stroke-width="5" stroke-linecap="round" />
      <text x="130" y="48" fill="#a6e3a1" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">NOW PLAYING</text>
      <text x="130" y="77" fill="#cdd6f4" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="700">Your current track</text>
      <text x="130" y="101" fill="#a6adc8" font-family="DejaVu Sans, sans-serif" font-size="16">All credited artists</text>
    </g>

    <text x="36" y="258" fill="#bac2de" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="700">Choose your style</text>
    <g transform="translate(36 278)">
      <rect width="92" height="39" rx="19.5" fill="#a6e3a1" />
      <text x="22" y="26" fill="#11111b" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="700">Mocha</text>
      <rect x="104" width="84" height="39" rx="19.5" fill="#313244" />
      <text x="126" y="26" fill="#cdd6f4" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="700">Spin</text>
      <rect x="200" width="84" height="39" rx="19.5" fill="#313244" />
      <text x="222" y="26" fill="#cdd6f4" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="700">Scan</text>
      <rect x="296" width="102" height="39" rx="19.5" fill="#313244" />
      <text x="313" y="26" fill="#cdd6f4" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="700">Rainbow</text>
    </g>

    <rect x="36" y="342" width="398" height="2" fill="#313244" />
    <text x="36" y="378" fill="#89b4fa" font-family="DejaVu Sans Mono, monospace" font-size="15">ajmal-spotify-readme.vercel.app</text>
  </g>
</svg>
